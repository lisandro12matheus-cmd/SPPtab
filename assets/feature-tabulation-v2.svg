<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" fill="none" role="img" aria-labelledby="title desc"><title id="title">Estrutura de uma tabulação configurável</title><desc id="desc">Exemplo visual de dimensões de análise, tabela cruzada e gráfico sem apresentar valores de saúde.</desc><rect width="720" height="390" rx="18" fill="#F1F5F4"/><rect x="42" y="39" width="636" height="312" rx="14" fill="white" stroke="#DCE7E4"/><path d="M42 89h636" stroke="#E6ECEA"/><circle cx="65" cy="64" r="4" fill="#CAD7D4"/><circle cx="79" cy="64" r="4" fill="#D6E0DE"/><text x="67" y="121" fill="#193D42" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">TABELA DE ANÁLISE</text><text x="67" y="142" fill="#72847F" font-family="Arial,sans-serif" font-size="10">Escolha linhas, colunas, medidas e filtros</text><rect x="67" y="164" width="367" height="154" rx="8" fill="#FBFCFC" stroke="#E0E8E6"/><rect x="68" y="165" width="365" height="31" rx="7" fill="#E7F0EF"/><g fill="#41666A" font-family="Arial,sans-serif" font-size="9" font-weight="700"><text x="82" y="185">DIMENSÃO</text><text x="227" y="185">AGRUPAMENTO</text><text x="351" y="185">MEDIDA</text></g><path d="M68 196h365m-365 30h365m-365 30h365m-365 30h365m-220-90v122m119-122v122" stroke="#E2E9E7"/><g fill="#617B7D" font-family="Arial,sans-serif" font-size="9"><text x="82" y="216">Estabelecimento</text><text x="227" y="216">Município</text><text x="351" y="216">Produção</text><text x="82" y="246">Procedimento</text><text x="227" y="246">Categoria</text><text x="351" y="246">Quantidade</text><text x="82" y="276">Competência</text><text x="227" y="276">Período</text><text x="351" y="276">Total</text></g><rect x="454" y="164" width="194" height="154" rx="8" fill="#FBFCFC" stroke="#E0E8E6"/><text x="470" y="187" fill="#577276" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing=".5">VISUALIZAÇÃO</text><path d="M474 289h152m-152-28h152m-152-28h152" stroke="#E7ECEB" stroke